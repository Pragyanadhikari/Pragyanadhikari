name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pragyanadhikari
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kathmandu
          output_action: commit

      - name: Coding Habits and Activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pragyanadhikari
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Kathmandu
          output_action: commit

      - name: Issues and Pull Requests
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pragyanadhikari
          base: ""
          plugin_followup: yes
          config_timezone: Asia/Kathmandu
          output_action: commit


      - name: Programming Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pragyanadhikari
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_other: yes
          config_timezone: Asia/Kathmandu
          output_action: commit

      - name: Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pragyanadhikari
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Asia/Kathmandu
          output_action: commit